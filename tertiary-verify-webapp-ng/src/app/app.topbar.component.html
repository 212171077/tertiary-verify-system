<style>
    @keyframes shake {

        0%,
        100% {
            transform: translateX(0);
        }

        10%,
        30%,
        50%,
        70%,
        90% {
            transform: translateX(-2px) rotate(0deg);
        }

        20%,
        40%,
        60%,
        80% {
            transform: translateX(2px) rotate(0deg);
        }
    }

    .shake-animation {
        animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }

    .logout-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .logout-btn:hover {
        background: #e53935;
        border-color: #e53935;
        transform: translateY(-1px);
    }

    .logout-btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
    }

    @media (max-width: 640px) {
        .logout-btn span {
            display: none;
        }
    }
</style>

<div class="layout-topbar">

    <!--<a class="layout-right-panel-button layout-topbar-icon" (click)="appMain.onRightMenuClick($event)" href="#">
            <i class="pi pi-ellipsis-v"></i>
    </a>-->

    <a href="#" class="layout-menu-button layout-topbar-icon" (click)="appMain.onMenuButtonClick($event)">
        <i class="pi pi-bars"></i>
    </a>

    <a href="#" class="layout-topbar-logo">
        <img id="topbar-logo" src="assets/layout/images/logo-white.png">
    </a>

    <!--<span class="layout-topbar-search">
        <i class="pi pi-search"></i>
        <input type="text" placeholder="Enter your search term">
    </span> -->

    <ul class="topbar-menu">
        <li class="user-profile" [ngClass]="{'active-topmenuitem fadeInDown': appMain.topbarUserMenuActive}">
            <a href="#" (click)="appMain.onTopbarUserMenuButtonClick($event)" *ngIf="!app.inlineUser">
                <img src="assets/layout/images/avatar.png" alt="roma-layout" />
                <div class="layout-profile-userinfo">
                    <span class="layout-profile-name">Arlene Welch</span>
                    <span class="layout-profile-role">Design Ops</span>
                </div>
            </a>
            <ul class="fadeInDown">
                <li>
                    <a href="#">
                        <i class="pi pi-fw pi-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="pi pi-fw pi-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="pi pi-fw pi-envelope"></i>
                        <span>Messages</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="pi pi-fw pi-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>
            </ul>
        </li>
        <li [ngClass]="{'active-topmenuitem fadeInDown': appMain.topbarNotificationMenuActive}">
            <a href="#" class="layout-topbar-icon" (click)="appMain.onTopbarNotificationMenuButtonClick($event)">
                <i class="topbar-icon pi pi-bell mr-4 p-text-secondary" pBadge style="font-size: 2rem;color: white;"
                    value="{{totalTasks}}" [ngClass]="{ 'shake-animation': animateShake }"></i>
            </a>

            <ul *ngIf="totalTasks > 0" class="fadeInDown">
                <div *ngFor="let task of tasks">
                    <li role="menuitem">
                        <a [href]="task.url">
                            <img src="{{task.image}}" alt="">
                            <div class="topbar-menu-info">
                                <span class="topbar-menu-name">{{ task.description }}</span>
                                <span class="topbar-menu-role">{{ task.objective }}</span>
                            </div>
                        </a>
                    </li>
                </div>
            </ul>

        </li>
        <li class="flex align-items-center">
            <button type="button" class="logout-btn" (click)="logout($event)" title="Log out" aria-label="Log out">
                <i class="pi pi-sign-out"></i>
                <span>Logout</span>
            </button>
        </li>

    </ul>
</div>
