<app-lookup-menu></app-lookup-menu>
<div class="grid" id="mainForm">
    <p-toast key="tst" [baseZIndex]="99999"></p-toast>
    <div class="col-12">
        <div class="card">
            <h4>Type of Institutions</h4>
            <p-panel header="" [toggleable]="false">
                <ng-template pTemplate="header">
                    <div class="flex align-items-center text-primary">
                        <span class="pi pi-book mr-2" style="font-size: 2rem"></span>
                        <span class="font-bold text-lg">Enter Institutions Type</span>
                    </div>
                </ng-template>
                <div class="p-fluid">
                    <div class="p-formgrid grid col-12">

                        <div class="field col-6">
                            <label>Description</label>
                            <input [(ngModel)]="updateRequest.description" [formControl]="descControl" pInputText
                                type="text" />
                            <div *ngIf="descControl.invalid && descControl.touched" class="text-danger">
                                <small *ngIf="descControl.errors?.required" class="error-message">
                                    Please enter description.
                                </small>
                            </div>

                        </div>
                    </div>
                </div>
                <ng-template pTemplate="footer">
                    <span class="button-container">
                        <p-toast></p-toast>
                        <button style="margin-left: 15px;margin-top: 10px;" pButton pRipple label="Submit"
                            icon="pi pi-save" (click)="saveData()" class="p-button-success mr-2 mb-2"
                            [disabled]="descControl.invalid"></button>
                        <p-confirmPopup key="confirm2"></p-confirmPopup>
                        <button style="margin-left: 15px;margin-top: 10px;" pButton pRipple label="Clear"
                            icon="pi pi-times" (click)="clearData()" class="p-button-primary mr-2 mb-2"></button>
                    </span>
                </ng-template>
            </p-panel>
        </div>
    </div>
</div>

<div class="grid">
    <div class="col-12">
        <div class="card">
            <h4>List of Institution Types</h4>
            <p-table #dt1 [value]="dataList" dataKey="id" [rows]="5" [loading]="loading" [rowHover]="true"
                styleClass="p-datatable-gridlines" [paginator]="true" [globalFilterFields]="['description']"
                responsiveLayout="scroll">
                <ng-template pTemplate="caption">
                    <div class="flex justify-content-between flex-column sm:flex-row">
                        <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                            (click)="clear(dt1)"></button>
                        <span class="p-input-icon-left mb-2">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" #filter
                                (input)="dt1.filterGlobal($event.target.value, 'contains')" placeholder="Search Keyword"
                                class="w-full" />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="description">Description <p-sortIcon field="description">
                            </p-sortIcon>
                            <p-columnFilter type="text" field="description" display="menu"
                                placeholder="Search by description"></p-columnFilter>
                        </th>
                        <th>
                            <div class="flex justify-content-between align-items-center">
                                Created date
                            </div>
                        </th>
                        <th>
                            <div class="flex justify-content-between align-items-center">
                                Last updated date
                            </div>
                        </th>

                        <th style="width: 8rem">
                            <div class="flex justify-content-between align-items-center">
                                
                            </div>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-data>
                    <tr>
                        <td style="min-width: 12rem;">
                            {{data.description}}
                        </td>
                        <td style="min-width: 10rem;">
                            {{data.createDate | date: 'MM/dd/yyyy'}}
                        </td>
                        <td style="min-width: 10rem;">
                            {{data.lastUpdateDate | date: 'MM/dd/yyyy'}}
                        </td>

                        <td class="text-center" style="min-width: 10rem;">
                            <p-toast></p-toast>
                            <button type="button" pButton pRipple icon="pi pi-database" (click)="updateData(data)"
                                style="margin-inline-end: 0.30rem;" class="p-button-success mr-2 mb-2"></button>
                            <p-confirmPopup key="confirm2"></p-confirmPopup>

                            <button type="button" pButton pRipple icon="pi pi-trash" (click)="deleteData($event, data)"
                                style="margin-inline-start: 0.30rem;" class="p-button-danger mr-2 mb-2"></button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="7">No data found.</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="loadingbody">
                    <tr>
                        <td colspan="7">Loading data. Please wait.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
