plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.tertiary.verify.tertiary_verify"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.tertiary.verify.tertiary_verify"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file('keystore/tertiary-verify-app-key.jks')
            storePassword 'TertiaryVerify'
            keyAlias 'tertiary-verify-app'
            keyPassword 'TertiaryVerify'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    println "👉 Flutter Build Config:"
    println "   minSdkVersion = ${flutter.minSdkVersion}"
    println "   targetSdkVersion = ${flutter.targetSdkVersion}"
    println "   versionCode = ${flutter.versionCode}"
    println "   versionName = ${flutter.versionName}"

}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.errorprone:error_prone_annotations:2.18.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}
